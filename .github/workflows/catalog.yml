name: Verzeichnis aktualisieren

on:
  schedule:
    - cron: "17 3 * * *"   # täglich 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: catalog.json bauen
        run: python tools/build_catalog.py catalog.json
      - name: Änderungen committen
        run: |
          if git diff --quiet -- catalog.json && git ls-files --error-unmatch catalog.json >/dev/null 2>&1; then
            echo "Keine Änderung"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Verzeichnis aktualisiert ($(date -u +%Y-%m-%d))"
          git push
